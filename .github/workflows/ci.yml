name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow so a tag push is gated by exactly the same
  # jobs as a pull request - including installer-e2e and the full OS matrix.
  workflow_call:

jobs:
  doc-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run base-owned document governance guard
        env:
          HARNESS_GUARD_EVENT: ${{ github.event_name }}
          HARNESS_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HARNESS_GUARD_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node -e 'const crypto = require("node:crypto");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");
          (function main() {
          const guardPath = "scripts/doc-governance-guard.js";
          const event = process.env.HARNESS_GUARD_EVENT || "unknown";
          const baseInput = process.env.HARNESS_GUARD_BASE_SHA || "";
          const candidateInput = process.env.HARNESS_GUARD_CANDIDATE_SHA || "";
          function warn(state, message) {
            console.log("::warning title=" + state + "::" + message);
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Document governance guard\n\n**" + state + "**: " + message + "\n\n", "utf8");
          }
          function git(args) {
            const result = spawnSync("git", args, { encoding: "buffer", maxBuffer: 16 * 1024 * 1024, env: { ...process.env, GIT_CONFIG_NOSYSTEM: "1", GIT_NO_REPLACE_OBJECTS: "1", GIT_PAGER: "cat", GIT_TERMINAL_PROMPT: "0" } });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error("git " + args[0] + " failed: " + Buffer.from(result.stderr || result.stdout || "").toString("utf8").trim());
            return Buffer.from(result.stdout || "");
          }
          function resolveCommit(input, label) {
            if (!/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/i.test(input)) throw new Error(label + " is not a full commit SHA");
            const resolved = git(["rev-parse", "--verify", "--quiet", "--end-of-options", input + "^{commit}"]).toString("ascii").trim().toLowerCase();
            if (resolved !== input.toLowerCase()) throw new Error(label + " did not resolve to the supplied commit SHA");
            return resolved;
          }
          if (event !== "pull_request") {
            warn("UNCHECKED", "No externally selected PR base/head is available for event " + event + "; the base-owned guard was not executed.");
            return;
          }
          try {
            const base = resolveCommit(baseInput, "PR base SHA");
            const candidate = resolveCommit(candidateInput, "PR head SHA");
            const checkout = process.env.GITHUB_SHA || "unavailable";
            console.log("PR head SHA used by the guard: " + candidate);
            console.log("GITHUB_SHA used by checkout and the ordinary suite: " + checkout + " (the pull_request checkout may be a synthetic merge commit).");
            const entries = git(["ls-tree", "-z", "--full-tree", base, "--", guardPath]);
            if (entries.length === 0) {
              warn("BOOTSTRAP_UNCHECKED", "Trusted base " + base + " has no " + guardPath + "; candidate guard was not executed. Independent review of the frozen candidate guard is required.");
              return;
            }
            if (entries[entries.length - 1] !== 0) throw new Error("base guard tree entry is not NUL terminated");
            const entry = entries.subarray(0, entries.length - 1);
            const tab = entry.indexOf(9);
            if (tab < 0 || entry.subarray(tab + 1).toString("utf8") !== guardPath) throw new Error("base guard tree entry is malformed");
            const [mode, type, oid] = entry.subarray(0, tab).toString("ascii").split(" ");
            if (!(["100644", "100755"].includes(mode)) || type !== "blob" || !/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/i.test(oid || "")) throw new Error("base guard is not a regular Git blob");
            const guardBytes = git(["cat-file", "blob", oid]);
            const digest = crypto.createHash("sha256").update(guardBytes).digest("hex");
            console.log("Base guard blob: " + oid + "; SHA-256: " + digest);
            const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), "harness-doc-governance-"));
            const tempGuard = path.join(tempDir, "doc-governance-guard.js");
            try {
              fs.writeFileSync(tempGuard, guardBytes, { mode: 0o600 });
              const result = spawnSync(process.execPath, [tempGuard, "--repo", process.cwd(), "--base", base, "--candidate", candidate], { encoding: "buffer", maxBuffer: 64 * 1024 * 1024, env: { ...process.env, GIT_CONFIG_NOSYSTEM: "1", GIT_NO_REPLACE_OBJECTS: "1", GIT_PAGER: "cat", GIT_TERMINAL_PROMPT: "0" } });
              if (result.error) throw result.error;
              if (result.stdout) process.stdout.write(result.stdout);
              if (result.stderr) process.stderr.write(result.stderr);
              process.exitCode = result.status === null ? 1 : result.status;
            } finally {
              fs.rmSync(tempDir, { recursive: true, force: true });
            }
          } catch (error) {
            console.error("Document governance guard setup failed: " + (error.message || String(error)));
            process.exitCode = 1;
          }
          })();'
  self-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies for regression suite
        run: npm ci
      - name: Verify OpenCode async process fixtures before the full suite
        run: node ci/mechanism-338-opencode-async.test.js
      - name: Run hermetic self-regression suite
        run: npm test
      - name: Run focused mutation checks
        run: npm run test:mutations

  # Pin the patched version: floating Node 24 already passed before #284.
  system-one-windows-node24-patched:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Verify exact patched runtime
        run: node -e "if (process.versions.node !== '24.22.1') process.exit(1)"
      - name: Exercise real evaluator subprocess and repeated resident teardown
        run: node --test ci/mechanism-system-one-resident.test.js

  # Node >=22 also includes the odd-numbered Node 23 line. Keep its
  # documented Windows shutdown failure visible, without narrowing engines.
  system-one-windows-node-legacy-policy:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['23.6.0', '24.15.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Verify exact affected runtime
        run: node -e "if (process.versions.node !== '${{ matrix.node }}') process.exit(1)"
      - name: Confirm explicit RS13 skip with version-policy unit coverage
        run: node --test --test-name-pattern="S1-RS00|S1-RS13" ci/mechanism-system-one-resident.test.js

  runtime-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies on minimum supported Node
        run: npm ci
      - name: Run representative regression suite on Node 22
        run: npm test
      - name: Verify installer contract on Node 22
        run: node ci/installer-roundtrip.test.js

  release-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install project dependencies
        run: npm ci
      - name: Install pinned semantic-release analyzer tooling
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts
          @semantic-release/commit-analyzer@13.0.1
          conventional-changelog-conventionalcommits@10.4.0
      - name: Verify semantic-release against real Git histories
        run: npm run test:release:semantics

  skill-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned waza CLI
        run: |
          WAZA_VERSION=0.38.6
          WAZA_SHA256=a799587795fd462411ca7c7af5faccee7e24f08e41d152c10738d31334d1c063
          mkdir -p "$HOME/bin"
          curl -fL --retry 3 --retry-all-errors \
            -o "$HOME/bin/waza" \
            "https://github.com/microsoft/waza/releases/download/v${WAZA_VERSION}/waza-linux-amd64"
          echo "${WAZA_SHA256}  $HOME/bin/waza" | sha256sum -c -
          chmod +x "$HOME/bin/waza"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/waza" --version
      - name: Run Harness Waza adapter against canonical skills
        run: npm run waza:check
      - name: Check every canonical SKILL.md passes waza readiness gates
        run: |
          fail=0
          for dir in $(find . -name "SKILL.md" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./plugins/*" -not -path "./ci/fixtures/*" -not -path "./eval-framework/fixtures/*" -exec dirname {} \; | sort); do
            out=$(waza check "$dir" 2>&1) || true
            echo "=== $dir"
            if echo "$out" | grep -q "Does not fully meet"; then
              echo "::error file=$dir/SKILL.md::waza spec compliance failed"
              fail=1
            fi
            if echo "$out" | grep -qE "SKILL.md is [0-9]+ tokens \(hard limit 500\)"; then
              echo "::error file=$dir/SKILL.md::token budget exceeded (hard limit 500)"
              fail=1
            fi
            if ! grep -q "^## USE FOR:" "$dir/SKILL.md"; then
              echo "::error file=$dir/SKILL.md::missing '## USE FOR:' trigger section"
              fail=1
            fi
            if ! grep -q "^## DO NOT USE FOR:" "$dir/SKILL.md"; then
              echo "::error file=$dir/SKILL.md::missing '## DO NOT USE FOR:' trigger section"
              fail=1
            fi
          done
          exit $fail
      - name: Verify eval coverage against SKILL.md requirements
        run: |
          fail=0
          for eval in evals/*/eval.yaml; do
            skill=$(dirname "$eval" | xargs basename)
            echo "=== $skill"
            waza spec verify "$skill" "$eval" --fail --threshold 1 || fail=1
          done
          exit $fail
      - name: Block canonical SKILL.md token growth vs base branch
        run: waza tokens compare "${{ github.event.pull_request.base.ref || 'HEAD' }}" --strict --threshold 10 --skills

  consistency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Node dependencies
        run: npm ci
      - name: Docs, manifest, and eval-coverage consistency
        run: npm run test:consistency
      - name: Skill executable and deep-dive references resolve
        run: npm run test:references
      - name: Release tag skill tree and references remain verifiable
        run: npm run test:release
      - name: Skill description collision detection
        run: npm run test:collision
      - name: OpenAI plugin package is in sync and runnable
        run: npm run test:plugin:openai
      - name: OpenAI public submission artifacts are reproducible
        run: npm run test:plugin:submission
      - name: Platform compatibility matrix matches official-source and installer contracts
        run: npm run test:platform:compatibility
      - name: Test sources stay portable across the OS matrix
        run: npm run test:portability

  installer-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: CLI --help works
        run: node bin/cli.js --help
      - name: Install, verify, uninstall, and restore seeded user files
        run: node ci/installer-roundtrip.test.js
