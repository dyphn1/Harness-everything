name: Weekly Behavioral Evaluations

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC
  workflow_dispatch:
    inputs:
      engine:
        description: 'Engine to run evals with (claude or opencode)'
        required: false
        default: 'opencode'

permissions:
  contents: read

jobs:
  behavioral-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run behavioral evals (opencode)
        if: github.event.inputs.engine == 'opencode' || github.event_name == 'schedule'
        run: node behavioral-evals/run.js run --engine opencode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run behavioral evals (claude)
        if: github.event.inputs.engine == 'claude'
        run: node behavioral-evals/run.js run --engine claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Validate case files (always runs)
        run: node behavioral-evals/run.js validate

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-eval-results-${{ github.run_id }}
          path: behavioral-evals/results/
          retention-days: 30