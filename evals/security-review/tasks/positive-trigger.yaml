id: positive-security-review-001
name: On-scope prompt triggers security-review
description: "Conducts STRIDE threat modeling, scans secrets via audit scripts, and hardens code against OWASP Top 10 risks with three-tier boundary controls. Use when implementing auth, handling input/uploads, managing secrets, or auditing code before deployment."
tags:
  - positive-trigger
inputs:
  prompt: "Do a security review of the new payments endpoint, checking OWASP patterns and secrets exposure."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "OWASP"
