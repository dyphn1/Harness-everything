id: positive-using-git-worktrees-001
name: On-scope prompt triggers using-git-worktrees
description: "Use when starting feature work needing isolation or before implementation plans - ensures an isolated workspace via native tools or git worktree fallback"
tags:
  - positive-trigger
inputs:
  prompt: "Set up a git worktree so I can prototype in parallel without disturbing my checked-out branch."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "worktree"
