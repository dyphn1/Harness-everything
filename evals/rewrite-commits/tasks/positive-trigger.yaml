id: positive-rewrite-commits-001
name: On-scope prompt triggers rewrite-commits
description: "Rewrite past Git history to comply with Angular Style conventions. Use when cleaning unpushed commits before a PR, squashing fixups, rewording messages, or reordering history safely with abort on conflict."
tags:
  - positive-trigger
inputs:
  prompt: "Rewrite my last five commits into clean conventional commits before opening the PR."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "rewrite"
