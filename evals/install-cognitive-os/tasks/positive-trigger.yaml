id: positive-install-cognitive-os-001
name: On-scope prompt triggers install-cognitive-os
description: "Explain or explicitly apply the Harness cognitive policy: Discover, Think, Try, Summarize, Record. It provides cross-cutting behavior without requiring this skill to be selected before domain skills."
tags:
  - positive-trigger
inputs:
  prompt: "Install the cognitive OS loop into this workspace so evidence assertion and state handoff are enforced."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "cognitive"
