id: positive-repo-docs-001
name: On-scope prompt triggers repo-docs
description: "Generate or update precise, reader-oriented README.md and AGENTS.md based on actual project scans and smart merging of existing files. Use when a project lacks documentation or needs refreshed agent onboarding docs."
tags:
  - positive-trigger
inputs:
  prompt: "Generate AGENTS.md and README documentation for this repo from its actual structure."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "AGENTS.md"
