id: positive-eval-harness-001
name: On-scope prompt triggers eval-harness
description: "Evaluate AI agent performance across correctness, token efficiency, anti-loop focus, and environment awareness; save a 4-dimension scorecard. Use when asked to run a benchmark or score an execution log or conversation history."
tags:
  - positive-trigger
inputs:
  prompt: "Score these two agent session logs against each other and tell me which performed better."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "score"
