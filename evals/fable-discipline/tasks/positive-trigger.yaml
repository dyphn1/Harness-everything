id: positive-fable-discipline-001
name: On-scope prompt triggers fable-discipline
description: Guard fable-mode context, stage scope, handoffs, commit boundaries, and build-divergence signals without adding independent hard stops.
tags:
  - positive-trigger
inputs:
  prompt: "Enforce stage discipline on this large parallel build-out with named workers and per-stage verification."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "stage"
