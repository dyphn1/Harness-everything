id: positive-fable-discipline-001
name: On-scope prompt triggers fable-discipline
description: Enforce fable-mode context discipline as a shadow guard. Use for staged multi-agent loops to compact state, constrain stage scope, verify handoffs, and surface build divergence without adding an independent hard stop.
tags:
  - positive-trigger
inputs:
  prompt: "Enforce stage discipline on this large parallel build-out with named workers and per-stage verification."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "stage"
