id: negative-fable-discipline-001
name: Off-scope prompt must not trigger fable-discipline
description: A request outside fable-discipline's DO NOT USE FOR scope must leave it dormant.
tags:
  - negative-trigger
inputs:
  prompt: "Rename the variable x to y in config.js."
expected:
  should_trigger: false
graders:
  - type: text
    name: not-contains-keywords
    config:
      contains:
        - "discipline"
        - "replan"
