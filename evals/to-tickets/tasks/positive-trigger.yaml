id: positive-to-tickets-001
name: On-scope prompt triggers to-tickets
description: A request squarely inside to-tickets's USE FOR scope must trigger it.
tags:
  - positive-trigger
inputs:
  prompt: "Break this approved spec into implementation tickets and publish them to our tracker format."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "ticket"
