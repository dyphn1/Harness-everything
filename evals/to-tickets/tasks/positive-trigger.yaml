id: positive-to-tickets-001
name: On-scope prompt triggers to-tickets
description: "Break a to-spec feature-spec, a plan, or a conversation into tracer-bullet tickets with declared blocking edges — one file per ticket locally or issues on a real tracker via projectDocs. Use when an approved spec needs dependency-aware ordering."
tags:
  - positive-trigger
inputs:
  prompt: "Break this approved spec into implementation tickets and publish them to our tracker format."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "ticket"
