id: positive-improve-codebase-architecture-001
name: On-scope prompt triggers improve-codebase-architecture
description: "Discovers and transforms shallow or bloated modules into deep, SRP-compliant ones by splitting oversized objects/functions, extracting seams, and decoupling interfaces."
tags:
  - positive-trigger
inputs:
  prompt: "Improve the architecture of this tangled billing module and produce a report of proposed refactorings."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "architecture"
