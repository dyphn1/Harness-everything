id: positive-git-commit-001
name: On-scope prompt triggers git-commit
description: "Generate Angular-style commit messages after verifying the environment, submodules, and staged files; use for explicit commit requests or concluded task phases."
tags:
  - positive-trigger
inputs:
  prompt: "Commit these staged changes with a conventional commit message following our house style."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "commit"
