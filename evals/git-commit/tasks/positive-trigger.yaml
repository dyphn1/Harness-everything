id: positive-git-commit-001
name: On-scope prompt triggers git-commit
description: "Generate Angular-style commits after inspecting repo state and staged changes; use only when the user or host workflow has authorized a commit."
tags:
  - positive-trigger
inputs:
  prompt: "Commit these staged changes with a conventional commit message following our house style."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "commit"
