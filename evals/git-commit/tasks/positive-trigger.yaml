id: positive-git-commit-001
name: On-scope prompt triggers git-commit
description: "Generate Angular-style commit messages after verifying repo state, submodules, and staged files. Use only for a user-requested or host/workflow-authorized commit; task completion alone is not authorization."
tags:
  - positive-trigger
inputs:
  prompt: "Commit these staged changes with a conventional commit message following our house style."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "commit"
