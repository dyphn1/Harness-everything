id: positive-create-agent-launcher-001
name: On-scope prompt triggers create-agent-launcher
description: A request squarely inside create-agent-launcher's USE FOR scope must trigger it.
tags:
  - positive-trigger
inputs:
  prompt: "Create an agent launcher that orchestrates subagents for this TypeScript monorepo."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "agent launcher"
