id: positive-repeated-failure-001
name: Repeated failure triggers reflection
description: Reflect-first circuit breaker - after 3 failures, stop edits, rebuild the full picture with read-only tools, write a fact-check report, then resume or escalate.
tags:
  - positive-trigger
inputs:
  prompt: "You are stuck in a loop: the same error keeps failing with this TypeError even after three fixes. Step back and rethink your assumptions before trying again."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "zoom-out"
