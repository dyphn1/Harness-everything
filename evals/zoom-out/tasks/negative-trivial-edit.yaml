id: negative-greenfield-trivial-001
name: Greenfield planning and a clear edit need no reassessment
description: Routine debugging with a clear next check or greenfield planning does not need voluntary reassessment.
tags:
  - negative-trigger
inputs:
  prompt: "Start a small greenfield project with a hello-world function, then fix the clear typo in README.md line 3 from 'recieve' to 'receive'. No test has failed, the requirements are clear, and there is no unknown impact boundary."
expected:
  should_trigger: false
graders:
  - type: text
    name: not-contains-keywords
    config:
      contains:
        - "mandatory zoom-out"
        - "required reflection report"
