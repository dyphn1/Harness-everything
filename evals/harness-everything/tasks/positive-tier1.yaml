id: positive-trivial-tier1-001
name: Trivial edit routes to Tier 1
description: "Triage new software requests into Tier 1/2/3 before work begins. USE FOR: \"triage a new software task\", \"route this coding request\". DO NOT USE FOR: \"chat or general Q&A\", \"non-software writing\", \"a skill is already indicated\"."
tags:
  - positive-trigger
  - tier-1
inputs:
  prompt: "Triage this new software task: fix the typo 'lorem ipsum' to 'lorem ipsum dolor' in docs/intro.md."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "Tier 1"
