id: positive-standard-tier2-001
name: Standard bug fix routes to Tier 2
description: "Triage new software requests into Tier 1/2/3 before work begins. USE FOR: \"triage a new software task\", \"route this coding request\". DO NOT USE FOR: \"chat or general Q&A\", \"non-software writing\", \"a skill is already indicated\"."
tags:
  - positive-trigger
  - tier-2
inputs:
  prompt: "Fix this bug: the checkout total double-counts coupon discounts when two coupons apply."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "Tier 2"
