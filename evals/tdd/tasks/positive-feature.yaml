id: positive-feature-tdd-001
name: Standard feature requests TDD enforcement
description: "Drive Standard Tasks (Tier 2) with Test-Driven Development (RED/GREEN/REFACTOR) backed by terminal test evidence. USE FOR: \"implement a feature test-first\", \"fix a bug with a regression test\", \"refactor safely under tests\". DO NOT USE FOR: \"macro planning or scaffolding\", \"docs-only work with no testable logic\"."
tags:
  - positive-trigger
inputs:
  prompt: "Implement a feature test-first: add input validation to the user signup function — reject emails without '@' and passwords shorter than 8 characters."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "RED"
        - "failing test"
