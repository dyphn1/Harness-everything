id: negative-trivia-001
name: Non-code question must not enter TDD loop
description: Docs-only work with no testable logic must not start a RED/GREEN cycle; macro planning or scaffolding belongs to fable-mode.
tags:
  - negative-trigger
inputs:
  prompt: "In one sentence, what does the RED phase of test-driven development mean?"
expected:
  should_trigger: false
graders:
  - type: text
    name: not-contains-keywords
    config:
      contains:
        - "writing a failing test now"
        - "entering RED"
