id: positive-fable-mode-001
name: On-scope prompt triggers fable-mode
description: "Stage large, multi-source or multi-session tasks through a written plan, named fable agents, failable per-stage checks, and skeptical delivery review; fable on opus|sonnet|haiku selects the model."
tags:
  - positive-trigger
inputs:
  prompt: "Execute this large multi-phase refactor of the persistence layer using parallel sub-agent workers."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "worker"
