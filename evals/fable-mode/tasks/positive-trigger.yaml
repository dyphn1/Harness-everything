id: positive-fable-mode-001
name: On-scope prompt triggers fable-mode
description: "Plan and execute complex Tier 3 macro tasks by breaking multi-domain requirements into architectural milestones and delegating sub-agents. Use for multi-domain work or major scaffolding; outputs milestone TODO plans, sub-agent briefs, verified gates."
tags:
  - positive-trigger
inputs:
  prompt: "Execute this large multi-phase refactor of the persistence layer using parallel sub-agent workers."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "worker"
