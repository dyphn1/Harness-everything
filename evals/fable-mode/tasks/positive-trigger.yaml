id: positive-fable-mode-001
name: On-scope prompt triggers fable-mode
description: "Stage large tasks through plans, named fable agents, failable checks, and skeptical review; fable on opus|sonnet|haiku selects a behavior profile, not a runtime model."
tags:
  - positive-trigger
inputs:
  prompt: "Execute this large multi-phase refactor of the persistence layer using parallel sub-agent workers."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "worker"
