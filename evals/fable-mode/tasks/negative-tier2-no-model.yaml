id: negative-fable-model-005
name: Ordinary Tier 2 work does not select a fable profile
description: A normal Tier 2 bugfix must not route to an explicit Fable behavior profile.
tags:
  - negative-trigger
  - tier-2
inputs:
  prompt: "Fix this checkout bug with a regression test; keep the change to the affected module."
expected:
  should_trigger: false
graders:
  - type: text
    name: no-explicit-profile-route
    config:
      contains:
        - "fable-opus"
        - "fable-sonnet"
        - "fable-haiku"
