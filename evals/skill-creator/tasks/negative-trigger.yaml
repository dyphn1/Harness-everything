id: negative-skill-creator-001
name: Off-scope prompt must not trigger skill-creator
description: A request outside skill-creator's DO NOT USE FOR scope must leave it dormant.
tags:
  - negative-trigger
inputs:
  prompt: "Run the linters over the project."
expected:
  should_trigger: false
graders:
  - type: text
    name: not-contains-keywords
    config:
      contains:
        - "SKILL.md"
        - "frontmatter"
