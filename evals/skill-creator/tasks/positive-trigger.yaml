id: positive-skill-creator-001
name: On-scope prompt triggers skill-creator
description: "Author, audit, and refactor SKILL.md files against one quality bar — the Skill Contract format. Use when creating a new skill, refactoring a SKILL.md, checking overlap, or packaging an insight as a dynamic skill."
tags:
  - positive-trigger
inputs:
  prompt: "Create a new skill for database migration workflows with proper references and testing workflow."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "skill"
