id: positive-grill-with-docs-001
name: On-scope prompt triggers grill-with-docs
description: "Challenge the plan against the existing domain model, sharpen terminology, and update CONTEXT.md and ADRs inline as decisions crystallise; use when stress-testing a plan against documented language and decisions."
tags:
  - positive-trigger
inputs:
  prompt: "Interview me about this domain and persist what we establish into CONTEXT.md and ADRs."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "ADR"
