id: positive-to-spec-001
name: On-scope prompt triggers to-spec
description: "Turn the conversation into a written spec — feature PRD, CLI/API reference, schema doc, or dev doc, whichever fits — and publish it per this repo's projectDocs framework; use when alignment is complete."
tags:
  - positive-trigger
inputs:
  prompt: "Turn this rough feature request into a full written spec with schema and CLI reference sections."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "spec"
