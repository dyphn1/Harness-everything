id: positive-environment-detection-001
name: On-scope prompt triggers environment-detection
description: "Use at session start (Discover phase) to detect and align with the operating system, shell (Git Bash vs PowerShell vs CMD), package managers, and dev tools; prevents blind command execution and repetitive tool errors."
tags:
  - positive-trigger
inputs:
  prompt: "Run environment detection so you know my OS, shell, and package manager before touching anything."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "shell"
