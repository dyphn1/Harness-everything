id: negative-build-multi-agent-system-001
name: Off-scope prompt must not trigger build-multi-agent-system
description: A request outside build-multi-agent-system's DO NOT USE FOR scope must leave it dormant.
tags:
  - negative-trigger
inputs:
  prompt: "Fix the typo in src/utils.js."
