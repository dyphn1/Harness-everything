id: positive-build-multi-agent-system-001
name: On-scope prompt triggers build-multi-agent-system
description: Scaffold a multi-agent workspace in any project by analyzing its tech stack at runtime: six functional zones, an immutable AGENTS.md router, and a shared memory index generated as a project-local script with a markdown fallback.
tags:
  - positive-trigger
inputs:
  prompt: "Design a multi-agent system architecture for our customer-support platform."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "multi-agent"
