id: positive-grill-me-001
name: On-scope prompt triggers grill-me
description: Stress-test plans and architectures one question at a time, expose blind spots, update domain terminology, and suggest an explicit to-spec handoff when alignment is complete.
tags:
  - positive-trigger
inputs:
  prompt: "Grill me on my startup idea until the requirements are airtight before we build anything."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "question"
