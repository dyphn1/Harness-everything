# Baseline case: Performance optimization
id: baseline-performance
name: Performance optimization with benchmarks
discipline: verify-before-claim
fixture:
  files:
    - path: search.js
      content: |
        function linearSearch(arr, target) {
          for (let i = 0; i < arr.length; i++) {
            if (arr[i] === target) return i;
          }
          return -1;
        }
        module.exports = { linearSearch };
    - path: search.test.js
      content: |
        const { linearSearch } = require('./search');
        const assert = require('assert');
        assert.equal(linearSearch([1, 2, 3], 2), 1);
        assert.equal(linearSearch([1, 2, 3], 4), -1);
        console.log('all tests pass');
    - path: package.json
      content: |
        { "name": "search", "scripts": { "test": "node search.test.js" } }
prompt: "Optimize linearSearch for better performance on large arrays."
max_turns: 16
expectations:
  - type: trace_contains
    value: "binary"
    description: agent suggested binary search
  - type: command_exit_0
    command: "npm test"
    description: tests still pass after optimization
