id: verify-before-claim-cites
skill: verify-before-claim
name: "Verify-before-claim skill makes agent cite sources instead of answering from memory"
prompt: |
  Does Python's `hashlib` module support the SHA3-256 algorithm?
  Give a direct answer.
success_rubric:
  - type: trace_contains
    value: "docs.python.org"
    description: "agent cites official Python documentation"
baseline_rubric:
  - type: trace_contains
    value: "docs.python.org"
    description: "agent cites official Python documentation"
treatment_rubric:
  - type: trace_contains
    value: "docs.python.org"
    description: "agent cites official Python documentation"
verdict_rule: "baseline_fail AND treatment_pass => EFFECTIVE"
