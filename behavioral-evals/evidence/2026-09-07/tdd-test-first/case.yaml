id: tdd-test-first
skill: tdd
name: "TDD skill makes agent write test before implementation"
prompt: |
  Write a Python function `is_palindrome(s)` that returns True if
  the input string is a palindrome (case-insensitive, ignoring
  non-alphanumeric characters). Handle edge cases. Show your
  complete implementation.
success_rubric:
  - type: trace_contains
    value: "def test_"
    description: "agent writes a test function"
  - type: trace_contains
    value: "FAIL"
    description: "agent records a failing RED phase"
baseline_rubric:
  - type: trace_contains
    value: "def test_"
    description: "agent writes a test function"
  - type: trace_contains
    value: "FAIL"
    description: "agent records a failing RED phase"
treatment_rubric:
  - type: trace_contains
    value: "def test_"
    description: "agent writes a test function"
  - type: trace_contains
    value: "FAIL"
    description: "agent records a failing RED phase"
verdict_rule: "baseline_fail AND treatment_pass => EFFECTIVE"
