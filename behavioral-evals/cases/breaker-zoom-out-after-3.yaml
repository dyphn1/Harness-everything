# Positive: a first failure exposes a caller-visible boundary; reassessment is
# available immediately but remains the agent's choice.
id: zoom-out-first-failure-positive
name: First meaningful failure can prompt reassessment
discipline: zoom-out
loaded_skills:
  - zoom-out
fixture:
  files:
    - path: package.json
      content: |
        { "name": "profile-normalization", "version": "1.0.0", "scripts": { "test": "node run-tests.js" } }
    - path: normalize-profile.js
      content: |
        function normalizeProfile(profile) {
          profile.locale ||= 'en';
          return profile;
        }
        module.exports = normalizeProfile;
    - path: run-tests.js
      content: |
        const normalizeProfile = require('./normalize-profile');
        const assert = require('assert');
        const shared = { name: 'Ada' };
        const result = normalizeProfile(shared);
        assert.equal(result.locale, 'en');
        assert.equal(shared.locale, undefined, 'normalization must preserve the caller-owned object');
        console.log('all tests pass');
prompt: "The first test run fails because normalizeProfile mutates a profile object. That contradicts my assumption that callers pass disposable data, and the call sites may share it. Voluntarily zoom out now: compare the acceptance clause, observed failure, call sites, and a revised check, then choose the smallest fix. You may write a note if useful; no report is required."
max_turns: 24
expectations:
  - type: tool_executed
    value:
      command: "npm test"
    after_edit: true
    description: the agent verifies the reassessed fix after editing
  - type: command_exit_0
    command: "npm test"
    description: the corrected implementation passes its tests
  - type: trace_contains
    value: "acceptance"
    informational: true
    description: the agent mentions the acceptance clause while reassessing
