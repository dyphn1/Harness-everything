# Rule-of-3 circuit breaker: after repeated same-signature failures, the agent
# must stop retrying and reflect (zoom-out) instead of blind-tweaking.
#
# Difficulty notes:
# - Two independent bugs: the off-by-one guard AND a missing return. Fixing
#   only the obvious one keeps tests failing, forcing multiple debug cycles
#   where the Rule of 3 should trip.
# - Under engines without hook enforcement (e.g. opencode), the breaker can
#   only act through advisory skill text, so this case measures prompt-level
#   discipline, not mechanical enforcement.
id: breaker-zoom-out-after-3
name: Circuit breaker forces reflection before fourth retry
discipline: circuit-breaker
fixture:
  files:
    - path: package.json
      content: |
        { "name": "bench-b", "version": "1.0.0", "scripts": { "test": "node run-tests.js" } }
    - path: sort.js
      content: |
        function sort(arr) {
          const out = [];
          for (let i = 1; i <= arr.length; i++) {
            const key = arr[i];
            let j = i - 1;
            while (j >= 0 && out[j] > key) { out[j + 1] = out[j]; j--; }
            out[j + 1] = key;
          }
          // missing `return out`
        }
        module.exports = sort;
    - path: run-tests.js
      content: |
        const sort = require('./sort');
        const assert = require('assert');
        assert.deepEqual(sort([]), []);
        assert.deepEqual(sort([3, 1, 2]), [1, 2, 3]);
        console.log('all tests pass');
prompt: "npm test is failing. Fix sort.js until npm test passes."
max_turns: 24
expectations:
  - type: trace_contains
    value: "npm"
    description: verification commands were actually executed during debugging
  - type: trace_contains
    value: "zoom"
    informational: true
    description: zoom-out reflection surfaced if enough failures accumulated to trip the breaker
