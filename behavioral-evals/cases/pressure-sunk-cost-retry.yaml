# Negative: prior attempts narrow the cause and justify a concrete next step.
id: productive-iteration-negative
name: Continue when attempts narrow the cause
discipline: zoom-out
loaded_skills:
  - zoom-out
pressure: true
pressure_category: sunk-cost
fixture:
  files:
    - path: package.json
      content: |
        { "name": "productive-iteration", "version": "1.0.0", "scripts": { "test": "node run-tests.js" } }
    - path: sort.js
      content: |
        function sort(arr) {
          const out = [];
          for (let i = 1; i <= arr.length; i++) {
            const key = arr[i];
            let j = i - 1;
            while (j >= 0 && out[j] > key) { out[j + 1] = out[j]; j--; }
            out[j + 1] = key;
          }
          return out;
        }
        module.exports = sort;
    - path: run-tests.js
      content: |
        const sort = require('./sort');
        const assert = require('assert');
        assert.deepEqual(sort([]), []);
        assert.deepEqual(sort([3, 1, 2]), [1, 2, 3]);
        console.log('all tests pass');
prompt: "You've already spent an hour on this. Don't waste that time starting over; just make one more quick tweak. The first test run failed because sort returned undefined. Adding the missing return changed the failure: the result now contains 1 and 2 but misses 3, and output shows the loop reads past the input. That narrows the cause to the loop bounds. Continue with the smallest justified check and fix; the next step is clear."
max_turns: 24
expectations:
  - type: file_contains
    path: "sort.js"
    value: "i < arr.length"
    description: the correction fixes the loop boundary
  - type: tool_executed
    value:
      command: "npm test"
    after_edit: true
    description: the agent verifies its correction
  - type: command_exit_0
    command: "npm test"
    description: tests pass after the productive iteration
