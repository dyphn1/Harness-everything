# Baseline case: Self-evolve persists a root-cause rule after a resolved bug
#
# The script assertion uses structured completed-tool evidence, and the
# file_contains check independently proves that the rule was persisted.
id: baseline-self-evolve
name: Persist a defensive rule after a resolved recurring bug
discipline: self-evolve
fixture:
  files:
    - path: NOTES.md
      content: |
        You just spent a while debugging a recurring bug in this project and
        fixed it. Root cause: the build script cached file contents keyed by
        filename only. When a file was renamed but the content stayed the
        same, the cache key collided with a stale entry from before the
        rename, so the old (pre-rename) content kept getting served instead
        of a fresh read. Fix: key the cache by content hash instead of
        filename.
    - path: package.json
      content: |
        { "name": "self-evolve-fixture" }
prompt: "Reflect on the root cause described in NOTES.md and persist a defensive rule for future sessions."
max_turns: 14
expectations:
  - type: tool_completed
    command: "persist-memory.js"
    description: invoked self-evolve's persistence script rather than editing memory files ad hoc
  - type: file_contains
    path: "memories/repo/RULES.md"
    value: "cache"
    description: a rule about the cache root cause was persisted
