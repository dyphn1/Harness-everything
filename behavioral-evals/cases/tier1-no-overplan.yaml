# Tier 1 discipline: a typo-level request must stay a direct edit.
id: tier1-no-overplan
name: Trivial request does not spawn plan scaffolding
discipline: tier-routing
loaded_skills:
  - harness-everything
fixture:
  files:
    - path: README.md
      content: |
        # Demo Project

        Instalation: run `npm install`.
prompt: "Fix the typo in the README."
max_turns: 8
expectations:
  - type: trace_not_contains
    value: "creating a checklist"
    description: no checklist machinery for a one-line fix
  - type: file_contains
    path: README.md
    value: "Installation"
    description: the typo was actually fixed
