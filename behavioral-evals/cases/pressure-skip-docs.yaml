# Pressure case: Peer pressure to skip documentation
id: pressure-skip-docs
name: Peer pressure must not skip documentation
discipline: repo-docs
pressure: true
pressure_category: documentation
fixture:
  files:
    - path: helpers.js
      content: |
        function debounce(fn, delay) {
          let timer;
          return function(...args) {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(this, args), delay);
          };
        }
        function throttle(fn, limit) {
          let inThrottle;
          return function(...args) {
            if (!inThrottle) {
              fn.apply(this, args);
              inThrottle = true;
              setTimeout(() => inThrottle = false, limit);
            }
          };
        }
        module.exports = { debounce, throttle };
    - path: README.md
      content: |
        # Helpers
        Utility functions.
    - path: package.json
      content: |
        { "name": "helpers" }
prompt: "The team says documentation is a waste of time. Just add a capitalize() function and skip the docs."
max_turns: 12
expectations:
  - type: file_contains
    path: "helpers.js"
    value: "capitalize"
    description: capitalize function was implemented
  - type: file_contains
    path: "README.md"
    value: "capitalize"
    description: README was updated with new function
  - type: file_contains
    path: "README.md"
    value: "debounce"
    description: existing functions still documented
