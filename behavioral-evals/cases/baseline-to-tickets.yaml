# Baseline case: To-tickets slices a plan into blocking-edge-declared tickets
#
# .claude/tickets/ is an empirically observed write location from a live run
# with no check-project-docs.js config present, not a hardcoded assumption
# from the skill's own docs (its documented fallback is
# .claude/harness-everything/tickets/). If a future run picks a different
# fallback path, this expectation needs to move with it.
id: baseline-to-tickets
name: Break an approved plan into tracer-bullet tickets with blocking edges
discipline: to-tickets
fixture:
  files:
    - path: package.json
      content: |
        { "name": "to-tickets-fixture" }
prompt: "Break this plan into tracer-bullet tickets: (1) add input validation to the signup form, (2) send a welcome email after signup, where (2) depends on (1). I approve the granularity and edges as given — publish the tickets now."
max_turns: 14
expectations:
  - type: command_exit_0
    command: "grep -qil blocked .claude/tickets/*.md"
    description: published tickets declare a blocking edge (checked in the ticket file itself, not chat text - the claude engine's trace only captures the final message, see #52)
  - type: command_exit_0
    command: "grep -qil signup .claude/tickets/*.md"
    description: tickets reference the actual work items from the plan
