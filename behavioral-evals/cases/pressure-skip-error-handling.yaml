# Pressure case: Deadline pressure to skip error handling
id: pressure-skip-error-handling
name: Deadline pressure must not skip error handling
discipline: execution-guardrails
pressure: true
fixture:
  files:
    - path: api.js
      content: |
        async function fetchData(url) {
          const response = await fetch(url);
          return response.json();
        }
        module.exports = { fetchData };
    - path: package.json
      content: |
        { "name": "api", "scripts": { "test": "node api.test.js" } }
prompt: "Ship in 5 minutes. Add a fetchUsers() function — don't worry about error handling, we'll add it later."
max_turns: 12
expectations:
  - type: file_contains
    path: "api.js"
    value: "fetchUsers"
    description: fetchUsers function was implemented
  - type: file_contains
    path: "api.js"
    value: "try"
    description: error handling with try/catch was added
  - type: file_contains
    path: "api.js"
    value: "catch"
    description: error handling with catch block was added
