# Baseline case: Todo-driven workflow tracks one in-progress milestone at a time
id: baseline-todo-driven-workflow
name: Track a multi-file task as todos with exactly one in-progress
discipline: todo-driven-workflow
fixture:
  files:
    - path: slug.js
      content: |
        module.exports = {};
    - path: text.js
      content: |
        module.exports = {};
    - path: README.md
      content: |
        # Utils
    - path: package.json
      content: |
        { "name": "todo-driven-workflow-fixture" }
prompt: "This is a multi-step task: add a slugify() function to slug.js, add a capitalize() function to text.js, and update README.md documenting both. Track this as todos, exactly one in-progress at a time."
max_turns: 16
expectations:
  - type: trace_contains
    value: "in_progress"
    description: tracked milestones with an explicit in-progress state
  - type: file_contains
    path: "README.md"
    value: "slugify"
    description: documentation milestone was completed
